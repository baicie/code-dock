[package]
name = "codedock-desktop"
description = "CodeDock Desktop DevTools（Tauri 2，§14）"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[lib]
name = "codedock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codedock-protocol = { path = "../../../crates/protocol" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
